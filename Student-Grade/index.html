<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <link rel="apple-touch-icon" sizes="180x180" href="../Graduation_Cap/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="../Graduation_Cap/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../Graduation_Cap/favicon-16x16.png">
    <link rel="icon" href="../Graduation_Cap/favicon.ico">
    <link rel="manifest" href="../Graduation_Cap/site.webmanifest">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Italiana&family=Story+Script&display=swap" rel="stylesheet">
     <link rel="stylesheet" href="student-grade.css"> 
    <title>  Student Grades</title>
</head>
<body>
    <h2>STUDENT GRADE CALCULATION</h2>

    <form>
        <div class="formclass"> 
       <label for="inputstu">Student Name:</label><br><br>
       <input type="text" id="inputstu" required><br><br>
       </div>
       <div class="formclass">
        <label for="sub1">Enter marks for Telugu Subject</label><br><br>
       <input type="text" id="sub1" placeholder="Telugu" required><br> <br>
       </div>
       <div class="formclass">
        <label for="sub2">Enter marks for Hindi Subject</label><br><br>
       <input type="text" id="sub2" placeholder="Hindi" required><br> <br>
       </div>
       <div class="formclass">
        <label for="sub3">Enter marks for English Subject</label><br><br>
       <input type="text" id="sub3" placeholder="English" required><br> <br>
       </div>
       <div class="formclass">
        <label for="sub4">Enter marks for Maths Subject</label><br><br>
       <input type="text" id="sub4" placeholder="Maths" required><br> <br>
       </div>
        <div class="formclass">
        <label for="sub5">Enter marks for Science Subject</label><br><br>
       <input type="text" id="sub5" placeholder="Science" required><br> <br>
       </div>
       <div class="formclass">
        <label for="sub6">Enter marks for Social Subject</label><br><br>
       <input type="text" id="sub6" placeholder="Social" required><br> <br>
       </div>
       <div class="formclass">
        <button id="sbt">SUBMIT</button>
        <p id="res"></p>
       </div>
    </form>
    <script src="student-grade.js"></script>
</body>
</html>
