<!DOCTYPE html>
<html>
<head>
    <title>Student Profile Card</title>

    <style>

        body{
            background-color:#f2f2f2;
            font-family:Arial, sans-serif;
        }

        .card{
            width:300px;
            background-color:white;
            margin:50px auto;
            padding:20px;
            text-align:center;
            border:1px solid gray;
            border-radius:10px;
        }

        img{
            width:120px;
            height:120px;
            border-radius:50%;
            border:2px solid blue;
        }

        h2{
            color:darkblue;
        }

        p{
            color:#555;
        }

        button{
            background-color:blue;
            color:white;
            padding:10px 20px;
            border:none;
            border-radius:5px;
            cursor:pointer;
        }

        button:hover{
            background-color:darkblue;
        }

    </style>
</head>

<body>

<div class="card">

    <img src="/DAY_1/profile_image.png" alt="Student Photo">

    <h2>Sri</h2>

    <p><b>Roll No:</b> 24PA1A5728</p>

    <p><b>Course:</b> B.Tech CS&BS</p>

    <p><b>College:</b> Vishnu Institute of Technology</p>

    <p><b>Email:</b> 24PA1A5728@VISHNU.EDU.IN</p>

    <button>View Profile</button>

</div>

</body>
</html>
