<!DOCTYPE html>
<html>
<head>
    <title>Photo Gallery</title>

    <style>

        body{
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            text-align: center;
        }

        h2{
            color: darkblue;
        }

        .gallery{
            width: 900px;
            margin: auto;
        }

        .gallery img{
            width: 250px;
            height: 180px;
            margin: 10px;
            border: 2px solid gray;
            border-radius: 8px;
        }

        .gallery img:hover{
            border-color: blue;
        }

    </style>
</head>

<body>

    <h2>Photo Gallery</h2>

    <div class="gallery">

        <img src="https://i.pinimg.com/1200x/9d/85/da/9d85da6105ba36baa3d8ec3ac3ae7070.jpg" alt="Photo 1">

        <img src="https://i.pinimg.com/736x/cb/79/a1/cb79a1550adc2b710370e31533128818.jpg" alt="Photo 2">

        <img src="https://i.pinimg.com/1200x/b2/3e/e9/b23ee9128c9311dbe07b35d0d4e45a7f.jpg" alt="Photo 3">

        <img src="https://i.pinimg.com/736x/a3/1f/d7/a31fd725a9afd0aa277e998a7c643f8c.jpg" alt="Photo 4">

        <img src="https://i.pinimg.com/736x/f7/59/41/f75941687e8fa24ff775160d258c2646.jpg" alt="Photo 5">

        <img src="https://i.pinimg.com/736x/4b/52/98/4b52984673246923e9c1236c8d13b089.jpg" alt="Photo 6">

    </div>

</body>
</html>
