<!DOCTYPE html>
<html>
<head>
    <title>Product Card</title>

    <style>

        body{
            background-color:#f2f2f2;
            font-family:Arial, sans-serif;
        }

        .card{
            width:300px;
            background-color:white;
            margin:50px auto;
            padding:20px;
            text-align:center;
            border:1px solid gray;
            border-radius:10px;
        }

        .card img{
            width:200px;
            height:200px;
            border-radius:5px;
        }

        h2{
            color:darkblue;
        }

        p{
            color:#555;
        }

        .price{
            color:green;
            font-size:22px;
            font-weight:bold;
        }

        button{
            background-color:blue;
            color:white;
            padding:10px 20px;
            border:none;
            border-radius:5px;
            cursor:pointer;
        }

        button:hover{
            background-color:darkblue;
        }

    </style>
</head>

<body>

<div class="card">

    <img src="https://i.pinimg.com/1200x/57/71/2f/57712f7c1014b09b3a76437adb471a98.jpg" alt="Product">

    <h2>Wireless Headphones</h2>

    <p>Bluetooth headphones with high-quality sound.</p>

    <p class="price">₹1,999</p>

    <button>Add to Cart</button>

</div>

</body>
</html>
