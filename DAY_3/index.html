<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>
<body>

    <div style="border:3px solid black; height:590px; width:420px; margin-left:600px; margin-top:150px; border-radius:30px;">

        <h3 style="text-align:center;">REGISTRATION FORM</h3>

        <form style="display:flex; justify-content:center; align-items:center; flex-direction:column; margin-top:40px;">

            <div style="display:flex; align-items:center; gap:15px; margin-bottom:25px;">
                <img src="name_icon.jpeg" style="width:80px; height:80px;">
                <input type="text"
                       placeholder="Full Name"
                       style="width:270px; padding:10px; border-radius:30px;"
                       required>
            </div>

            <div style="display:flex; align-items:center; gap:15px; margin-bottom:25px;">
                <img src="emailicon.jpeg" style="width:80px; height:80px;">
                <input type="email"
                       placeholder="username@gmail.com"
                       style="width:270px; padding:10px; border-radius:30px;"
                       required>
            </div>

            <div style="display:flex; align-items:center; gap:15px; margin-bottom:35px;">
                <img src="password_icon.jpeg" style="width:70px; height:70px;">
                <input type="password"
                       placeholder="Password"
                       style="width:270px; padding:10px; border-radius:30px;"
                       required>
            </div>

            <input type="submit"
                   value="Submit"
                   style="padding:15px 30px; border-radius:30px;">
            <p>---------------------OR------------------------</p>
            <div>
                <a href="https://accounts.google.com/" target="_blank">
                <img src="google_icon.jpeg" alt="Google" width="40" height="40">
                 </a>
                 <a href="https://www.facebook.com/login/" target="_top"> 
                <img src="facebook-icon.jpeg" style="height:60px;width:60px; gap:10px;">
                </a>
                <a href="https://account.apple.com/sign-in" target="_blank"> 
                <img src="Apple_logo.jpeg" style="height:60px; width:60px; gap:10px;">
                </a>
            </div>

        </form>

    </div>

</body>
</html>
