<!DOCTYPE html>
<html>
<head>
    <title>Student Grade Card</title>

    <style>

        body{
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        .card{
            width: 350px;
            margin: 50px auto;
            background-color: white;
            padding: 20px;
            border: 1px solid gray;
            border-radius: 10px;
        }

        h2{
            text-align: center;
            color: darkblue;
        }

        table{
            width: 100%;
            border-collapse: collapse;
        }

        table, th, td{
            border: 1px solid black;
        }

        th{
            background-color: lightblue;
        }

        th, td{
            padding: 10px;
            text-align: center;
        }

        .grade{
            text-align: center;
            margin-top: 15px;
            font-size: 20px;
            color: green;
            font-weight: bold;
        }

    </style>

</head>

<body>

<div class="card">

    <h2>Student Grade Card</h2>

    <table>

        <tr>
            <th>Subject</th>
            <th>Marks</th>
        </tr>

        <tr>
            <td>English</td>
            <td>90</td>
        </tr>

        <tr>
            <td>Maths</td>
            <td>95</td>
        </tr>

        <tr>
            <td>Science</td>
            <td>88</td>
        </tr>

        <tr>
            <td>Social</td>
            <td>92</td>
        </tr>

        <tr>
            <td>Computer</td>
            <td>96</td>
        </tr>

    </table>

    <div class="grade">
        Grade: A+
    </div>

</div>

</body>
</html>
